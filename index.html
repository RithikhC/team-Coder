<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ListIt — Post & browse listings</title>
  <meta name="description" content="ListIt: a lightweight marketplace to post and browse listings.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='700' font-size='20' text-anchor='middle' fill='white'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#listings">Skip to listings</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span>ListIt</span>
      </a>
      <p class="tagline">Post it. Find it. Done.</p>
      <div class="header-tools">
        <label for="display-currency" class="header-label">Show prices in</label>
        <select id="display-currency" class="currency-select"></select>
      </div>
    </div>
  </header>

  <main class="container layout">
    <aside class="panel post-panel" aria-labelledby="post-heading">
      <h2 id="post-heading">Post a listing</h2>
      <p class="panel-sub">It takes ten seconds. No account needed.</p>

      <form id="listing-form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" maxlength="80" required
                 placeholder="e.g. Vintage road bike" autocomplete="off">
          <p class="error" data-error-for="title" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="price">Price</label>
          <div class="price-row">
            <input id="price" name="price" type="number" min="0" step="0.01" required
                   inputmode="decimal" placeholder="0.00">
            <label for="currency" class="visually-hidden">Currency</label>
            <select id="currency" name="currency" class="currency-select"></select>
          </div>
          <p class="error" data-error-for="price" aria-live="polite"></p>
          <p class="price-preview" id="price-preview" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Choose a category…</option>
          </select>
          <p class="error" data-error-for="category" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="description">Description <span class="optional">(optional)</span></label>
          <textarea id="description" name="description" rows="3" maxlength="300"
                    placeholder="Condition, size, pickup details…"></textarea>
        </div>

        <button class="btn btn-primary btn-block" type="submit">Post listing</button>
        <button class="btn btn-ghost btn-block cancel-edit" type="button" id="cancel-edit" hidden>Cancel editing</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </aside>

    <section class="browse" aria-labelledby="browse-heading">
      <h2 id="browse-heading" class="visually-hidden">Browse listings</h2>

      <div class="toolbar">
        <div class="search">
          <label for="search" class="visually-hidden">Search listings</label>
          <input id="search" type="search" placeholder="Search listings…  (press / to focus)" autocomplete="off">
        </div>
        <div class="sort">
          <label for="sort" class="visually-hidden">Sort listings</label>
          <select id="sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="price-asc">Price: low → high</option>
            <option value="price-desc">Price: high → low</option>
          </select>
        </div>
      </div>

      <div class="rates-status" id="rates-status" role="status" aria-live="polite"></div>

      <div class="chips" id="category-chips" role="group" aria-label="Filter by category"></div>

      <p class="result-count" id="result-count" aria-live="polite"></p>
      <ul class="grid" id="listings"></ul>

      <div class="empty" id="empty-state" hidden>
        <p class="empty-title">No listings match.</p>
        <p>Try a different search or category — or post the first one!</p>
      </div>
    </section>
  </main>

  <dialog id="detail" class="dialog" aria-labelledby="detail-title">
    <div id="detail-body"></div>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <div class="container">Built for Code &amp; Chaos · Team Coder</div>
  </footer>

  <script src="js/categories.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/store.js"></script>
  <script src="js/saved.js"></script>
  <script src="js/view.js"></script>
  <script src="js/form.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/pricing.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/sparkline.js"></script>
  <script src="js/price-history.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/manage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
